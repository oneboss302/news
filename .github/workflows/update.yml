name: Update news

on:
  schedule:
    - cron: "7 */2 * * *"   # every 2 hours (UTC), a few minutes past to dodge the top-of-hour queue
  workflow_dispatch:         # "Run workflow" button for a manual refresh
  push:
    branches: [main]
    paths-ignore: [index.html]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page from feeds
        run: python3 build.py index.html
      - name: Commit snapshot
        run: |
          git config user.name "news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || { git commit -m "Update headlines $(date -u +'%Y-%m-%d %H:%M UTC')" && git push; }
      - name: Stage site
        run: mkdir _site && cp index.html CNAME .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
